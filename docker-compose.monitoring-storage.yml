# Part 6 Compose fragment: PostgreSQL + evaluation worker.
# Merge with: docker compose -f docker-compose.yml -f docker-compose.monitoring-storage.yml up
# Secrets come from .env (git-ignored); see .env.example for the variable names.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cardquery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardquery} -d ${POSTGRES_DB:-cardquery}"]
      interval: 5s
      timeout: 3s
      retries: 10

  drift-worker:
    build:
      context: .
      dockerfile: monitoring/Dockerfile.drift
    environment:
      CARDQUERY_DRIFT_ENGINE: evidently
      CARDQUERY_METRICS_ENGINE: evidently
      DATABASE_URL: postgresql://${POSTGRES_USER:-cardquery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cardquery}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
