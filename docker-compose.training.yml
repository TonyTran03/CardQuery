services:

  mlflow:
    build:
      context: .
      dockerfile: training/Dockerfile

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"

    ports:
      - "127.0.0.1:5001:5000"

    volumes:
      - mlflow_data:/mlflow

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 15

  training:
    build:
      context: .
      dockerfile: training/Dockerfile

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CARDQUERY_PARSER_BACKEND: real
      TRAINING_DATA_PATH: data/query_examples.csv
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"

    depends_on:
      mlflow:
        condition: service_healthy

    volumes:
      - ./artifacts:/app/artifacts

    command:
      - python
      - -m
      - training.bootstrap

volumes:
  mlflow_data: