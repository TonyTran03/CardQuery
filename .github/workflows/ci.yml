name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Lint and application tests
    runs-on: ubuntu-latest
    env:
      RUN_MLFLOW_INTEGRATION: "1"
      RUN_LOCAL_DEMO_TESTS: "1"
      PREFECT_SERVER_EPHEMERAL_ENABLED: "true"
      PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: "120"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --select E9,F63,F7,F82
      - run: python -m pytest -q

  monitoring:
    name: PostgreSQL and Evidently tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardquery
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: cardquery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardquery -d cardquery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cardquery:ci-password@localhost:5432/cardquery
      DO_NOT_TRACK: "1"
      EVIDENTLY_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r monitoring/requirements.txt
      - run: python -c "import os; from monitoring.persistence import apply_schema; apply_schema(os.environ['TEST_DATABASE_URL'])"
      - run: python -m pytest tests/test_monitoring.py -q

  stack:
    name: Container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build
        timeout-minutes: 25
      - name: Wait for initial simulator
        run: |
          simulator_id=$(docker compose ps -aq simulator)
          test "$(docker wait "$simulator_id")" = "0"
      - run: python scripts/smoke_stack.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
