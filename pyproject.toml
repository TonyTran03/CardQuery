[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardquery-parser"
version = "0.1.0"
description = "Part 2: TF-IDF/logistic-regression Pokémon card query parser"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn==1.8.0", "numpy==2.4.3", "scipy==1.17.1",
  "joblib==1.5.3", "threadpoolctl==3.6.0",
]

[tool.setuptools.packages.find]
include = ["parser*", "catalog*"]

[tool.setuptools.package-data]
parser = ["demo/*.html"]
